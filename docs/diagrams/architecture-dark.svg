<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="832" viewBox="0 0 1200 832" role="img" aria-labelledby="t d">
<title id="t">Architecture of the order-events stream</title>
<desc id="d">A Producer sends events keyed by orderId to the topic order-events, six partitions in a single-node Kafka 4 container. Consumer 1, 2 and 3 of the group order-history each poll two partitions and send heartbeats and commits to the Group coordinator, which stores committed offsets in __consumer_offsets. The Lag reader reads committed and log-end offsets. Failure paths: with key None one order lands on several partitions, and with eight consumers two sit idle.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="831" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="830" rx="16"/>
<text class="title" x="48" y="68">The order-events stream</text>
<text class="caption" x="48" y="100">One producer, one log of six partitions, one group that shares them. The key keeps an order on one partition.</text>

<rect class="svc" x="48" y="176" width="200" height="120" rx="12"/>
<text class="name" x="64" y="212">Producer</text>
<text class="sub" x="64" y="236">produce_cli.py</text>
<text class="sub" x="64" y="258">1,000 orders</text>
<rect class="note" x="48" y="340" width="300" height="124" rx="10"/>
<text class="label b t-warn" x="64" y="370">make run-unkeyed</text>
<text class="sub" x="64" y="396">no key: one order's events</text>
<text class="sub" x="64" y="418">land on several partitions,</text>
<text class="sub" x="64" y="440">so they arrive out of order</text>
<rect class="boundary" x="392" y="132" width="332" height="456" rx="14"/>
<text class="tag" x="408" y="160">Single-node Kafka 4 in a container</text>
<rect class="svc" x="412" y="176" width="292" height="120" rx="12"/>
<text class="name" x="428" y="206">order-events</text>
<text class="sub" x="428" y="230">6 partitions, RF 1, 7 days</text>
<rect class="slot" x="428" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="447" y="267" text-anchor="middle">0</text>
<rect class="slot" x="472" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="491" y="267" text-anchor="middle">1</text>
<rect class="slot" x="516" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="535" y="267" text-anchor="middle">2</text>
<rect class="slot" x="560" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="579" y="267" text-anchor="middle">3</text>
<rect class="slot" x="604" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="623" y="267" text-anchor="middle">4</text>
<rect class="slot" x="648" y="244" width="38" height="36" rx="5"/>
<text class="label t-accent" x="667" y="267" text-anchor="middle">5</text>
<rect class="svc" x="412" y="360" width="292" height="84" rx="12"/>
<text class="name" x="428" y="392">Group coordinator</text>
<text class="sub" x="428" y="416">the broker: runs rebalances</text>
<path class="store" d="M412 488a146 12 0 0 1 292 0v64a146 12 0 0 1 -292 0z"/>
<path class="rim" d="M412 488a146 12 0 0 0 292 0"/>
<text class="name" x="558" y="528" text-anchor="middle">__consumer_offsets</text>
<text class="sub" x="558" y="550" text-anchor="middle">committed offsets</text>
<rect class="boundary" x="892" y="132" width="260" height="456" rx="14"/>
<text class="tag" x="908" y="160">Consumer group</text>
<text class="tag b t-ink" x="908" y="180">order-history</text>
<rect class="svc" x="912" y="196" width="220" height="68" rx="12"/>
<text class="name" x="928" y="224">Consumer 1</text>
<text class="sub" x="928" y="248">partitions 0, 1</text>
<rect class="svc" x="912" y="272" width="220" height="68" rx="12"/>
<text class="name" x="928" y="300">Consumer 2</text>
<text class="sub" x="928" y="324">partitions 2, 3</text>
<rect class="svc" x="912" y="348" width="220" height="68" rx="12"/>
<text class="name" x="928" y="376">Consumer 3</text>
<text class="sub" x="928" y="400">partitions 4, 5</text>
<rect class="note" x="908" y="444" width="228" height="120" rx="10"/>
<text class="label b t-warn" x="920" y="470">make scale N=8</text>
<text class="sub" x="920" y="494">6 work, 2 sit idle:</text>
<text class="sub" x="920" y="516">six partitions are</text>
<text class="sub" x="920" y="538">the ceiling</text>
<rect class="svc" x="412" y="640" width="292" height="108" rx="12"/>
<text class="name" x="428" y="672">Lag reader</text>
<text class="sub" x="428" y="696">make lag-report</text>
<text class="sub" x="428" y="718">kafka-consumer-groups.sh</text>
<text class="label t-ink" x="724" y="700">lag = log-end offset - committed offset</text>
<path class="async" d="M248 212H412"/>
<text class="label t-accent" x="260" y="200">key = orderId</text>
<path class="fail" d="M248 268H412"/>
<text class="label t-warn" x="260" y="290">key = None</text>
<path class="async" d="M704 230H912"/>
<path class="async" d="M808 230V294Q808 306 820 306H912"/>
<path class="async" d="M780 230V370Q780 382 792 382H912"/>
<text class="label t-accent" x="732" y="220">poll</text>
<path class="sync" d="M892 414H704"/>
<text class="label t-accent" x="730" y="436">heartbeat, commit</text>
<path class="sync" d="M558 444V476"/>
<text class="label t-accent" x="570" y="466">stores</text>
<path class="read" d="M558 588V640"/>
<text class="label" x="570" y="620">committed and log-end offsets</text>

<path class="sync" d="M48 788H112"/><text class="legend" x="124" y="793">sync call</text>
<path class="async" d="M264 788H328"/><text class="legend" x="340" y="793">async message</text>
<path class="read" d="M520 788H584"/><text class="legend" x="596" y="793">read</text>
<path class="fail" d="M696 788H760"/><text class="legend" x="772" y="793">failure path</text>
</svg>
