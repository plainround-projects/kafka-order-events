<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="836" viewBox="0 0 1200 836" role="img" aria-labelledby="t d">
<title id="t">One keyed run of make run, step by step</title>
<desc id="d">Seven numbered steps. make reset-topic recreates order-events. The Producer interleaves up to 50 open orders and sends each event with key orderId; the broker appends and acknowledges. A Consumer joins the group, the Group coordinator assigns all six partitions, and the consumer polls and checks each sequence. After five idle seconds or a signal it commits, leaves and prints out-of-order events logged: 0. Warning branch: make run-unkeyed sends key None, so about 1,700 of 3,000 events arrive out of order.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="835" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="834" rx="16"/>
<text class="title" x="48" y="68">One run of make run</text>
<text class="caption" x="48" y="100">Produce 1,000 orders, read them back, check every sequence. The warning rows are the same run with no key.</text>

<rect class="actor" x="398" y="128" width="124" height="48" rx="24"/>
<text class="lane" x="460" y="158" text-anchor="middle">make run</text>
<rect class="svc" x="545" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="610" y="158" text-anchor="middle">Producer</text>
<rect class="svc" x="695" y="128" width="150" height="48" rx="10"/>
<text class="lane" x="770" y="158" text-anchor="middle">order-events</text>
<rect class="svc" x="875" y="128" width="130" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">Consumer</text>
<rect class="svc" x="1025" y="128" width="127" height="48" rx="10"/>
<text class="lane" x="1088" y="148" text-anchor="middle">Group</text>
<text class="lane" x="1088" y="168" text-anchor="middle">coordinator</text>
<path class="hair" d="M460 176V692M610 176V692M770 176V752M940 176V752M1088 176V752"/>
<path class="hair" d="M66 216V728"/>
<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Reset the topic</text>
<text class="sub" x="96" y="232">make reset-topic: six partitions</text>
<path class="sync" d="M460 216H770"/>
<text class="label t-accent" x="622" y="206">delete, recreate</text>
<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">The Producer plans</text>
<text class="sub" x="96" y="296">1,000 orders, up to 50 open</text>
<rect class="slot" x="604" y="262" width="12" height="36" rx="4"/>
<text class="label t-accent" x="626" y="285">interleave()</text>
<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">It sends each event</text>
<text class="sub" x="96" y="360">murmur2(key) % 6 picks a partition</text>
<path class="async" d="M610 344H770"/>
<text class="label t-accent" x="622" y="334">key=orderId</text>
<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="404">make run-unkeyed: no key</text>
<text class="sub" x="96" y="424">an order lands on many partitions</text>
<path class="fail" d="M610 408H770"/>
<text class="label t-warn" x="622" y="398">key=None</text>
<path class="fail" d="M770 408H844Q856 408 856 420V652Q856 664 868 664H932"/>
<circle class="dot" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="468">The broker appends</text>
<text class="sub" x="96" y="488">acks; the Producer flushes at end</text>
<path class="sync" d="M770 472H610"/>
<text class="label t-accent" x="622" y="462">ack</text>
<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">5</text>
<text class="label b t-ink" x="96" y="532">A Consumer joins the group</text>
<text class="sub" x="96" y="552">alone, so it gets all six</text>
<path class="sync" d="M940 526H1088"/>
<text class="label t-accent" x="952" y="516">join group</text>
<path class="sync" d="M1088 546H940"/>
<text class="label t-accent" x="952" y="566">all 6 assigned</text>
<circle class="dot" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="596">It polls and checks</text>
<text class="sub" x="96" y="616">sequence = last seen + 1</text>
<path class="async" d="M770 600H940"/>
<text class="label t-accent" x="786" y="590">poll()</text>
<rect class="slot" x="934" y="582" width="12" height="36" rx="4"/>
<text class="label t-accent" x="956" y="605">OrderChecker</text>
<circle class="dot-w" cx="66" cy="664" r="15"/><text class="num" x="66" y="669" text-anchor="middle">6x</text>
<text class="label b t-warn" x="96" y="660">A sequence is out of order</text>
<text class="sub" x="96" y="680">about 1,700 of 3,000 when unkeyed</text>
<rect class="note" x="934" y="646" width="12" height="36" rx="4"/>
<text class="label t-warn" x="956" y="669">warning logged</text>
<circle class="dot-g" cx="66" cy="728" r="15"/><text class="num" x="66" y="733" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="724">It stops and reports</text>
<text class="sub" x="96" y="744">5 s idle, or SIGINT or SIGTERM</text>
<path class="sync" d="M940 728H1088"/>
<text class="label t-accent" x="952" y="718">commit, leave</text>
<path class="ok" d="M940 728H724"/>
<rect class="win" x="424" y="708" width="300" height="40" rx="10"/>
<text class="label b t-good" x="440" y="733">out-of-order events logged: 0</text>

<path class="sync" d="M48 792H112"/><text class="legend" x="124" y="797">sync call</text>
<path class="async" d="M264 792H328"/><text class="legend" x="340" y="797">async message</text>
<path class="fail" d="M696 792H760"/><text class="legend" x="772" y="797">failure path</text>
<path class="ok" d="M928 792H992"/><text class="legend" x="1004" y="797">result</text>
</svg>
